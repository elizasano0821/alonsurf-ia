<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alon Surf | Book a Lesson</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="env-bar"></div>
  <header>
    <img src="images/logo.svg" alt="Alon Surf logo" class="logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="lessons.html">Lessons</a>
      <a href="book.html">Book a Lesson</a>
    </nav>
  </header>
  <main>
    <h1>Book a Lesson</h1>
    <form id="bookingForm">
      <label for="name">Name</label>
      <input type="text" id="name" name="name">
      <div class="error" id="nameError"></div>

      <label for="mobile">Mobile number</label>
      <input type="text" id="mobile" name="mobile" placeholder="09171234567">
      <div class="error" id="mobileError"></div>

      <label for="lesson">Lesson</label>
      <select id="lesson" name="lesson">
        <option>Beginner Group Lesson</option>
        <option>Private Lesson</option>
        <option>Intermediate Coaching</option>
        <option>Board Rental (half day)</option>
        <option>Board Rental (full day)</option>
      </select>

      <label for="students">Number of students</label>
      <input type="number" id="students" name="students" min="1" step="1" required>
      <div class="error" id="studentsError"></div>

      <label for="date">Preferred date</label>
      <input type="date" id="date" name="date">

      <button type="submit">Book lesson</button>
    </form>
    <div id="thanks"></div>
  </main>
  <footer>
    <p>Alon Surf &middot; Surf School and Board Rental &middot; San Juan, La Union<br>Open daily, 6:00 AM to 6:00 PM</p>
  </footer>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
